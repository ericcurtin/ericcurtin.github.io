---
layout: default
---
<section class="intro">
  <h1>Eric Curtin</h1>
  <p>Notes on Linux, containers, local inference and agents.</p>
</section>
<section class="posts">
  {% for post in site.posts %}
  <article class="post-card">
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time></p>
    <p>{{ post.excerpt | strip_html | truncatewords: 60 }}</p>
    <p><a class="more" href="{{ post.url | relative_url }}">Read more &rarr;</a></p>
  </article>
  {% endfor %}
</section>
